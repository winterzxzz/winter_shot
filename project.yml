name: WinterShot
options:
  bundleIdPrefix: com.winterzxzz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  WinterShot:
    type: application
    platform: macOS
    sources:
      - WinterShot
    info:
      path: WinterShot/Info.plist
      properties:
        CFBundleDisplayName: WinterShot
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winterzxzz.WinterShot
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sign with the local Apple Development cert (by hash — the two
        # revoked twins share its name) so the signature is stable across
        # rebuilds and TCC permissions stick. Fall back to "-" if absent.
        CODE_SIGN_IDENTITY: "2E8C8843523E16FAF9C2A0EEFE944335933E5C16"
        DEVELOPMENT_TEAM: DA9KW67BQV
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
