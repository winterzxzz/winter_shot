name: WinterShot
options:
  bundleIdPrefix: com.winterzxzz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  WinterShot:
    type: application
    platform: macOS
    sources:
      - WinterShot
    info:
      path: WinterShot/Info.plist
      properties:
        CFBundleDisplayName: WinterShot
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "3"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winterzxzz.WinterShot
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sign with the local Apple Development cert of the personal team so
        # the code-signing requirement — and therefore the Screen Recording /
        # TCC grants — stays the same across rebuilds, reinstalls and updates.
        # Pinned by team, not by cert hash, so a renewed cert keeps building.
        # This is the team every published build has shipped under, so an
        # update keeps the permission a user already granted; the certs of the
        # other personal team (3YQ3747D5H) are all revoked.
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: H72HDR4743
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
